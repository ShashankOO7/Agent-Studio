#database configurations

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:agentstudio}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  ai:
    model:
      chat:
        client: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-3.8-flash}


    vectorstore:
      pgvector:
        index-type: NONE
        distance-type: COSINE_DISTANCE
        dimensions: 3072
        table-name: vector_store
        schema-name: public
        initialize-schema: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB



#app configurations
app:
  rag:
    chunk-size: 700
#    chunk-overlap: 100
    top-k: 5
    similarity-threshold: 0.0

  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"


#jwt configurations


jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000


bootui:
  enabled: ON


logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
